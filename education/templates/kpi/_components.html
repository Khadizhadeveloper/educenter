<!-- KPI component bars partial — included in student & mentor KPI pages -->
<div class="mb-4">
  <div class="d-flex justify-content-between mb-1">
    <span><i class="bi bi-calendar-check text-info"></i> Посещаемость</span>
    <strong>{{ kpi.attendance_score|floatformat:1 }}%</strong>
  </div>
  <div class="component-bar">
    <div class="fill fill-attendance" style="width:{{ kpi.attendance_score }}%"></div>
  </div>
  <small class="ok-muted">Вес: 40%</small>
</div>

<div class="mb-4">
  <div class="d-flex justify-content-between mb-1">
    <span><i class="bi bi-journal-text" style="color:var(--ok-accent)"></i> Домашние задания</span>
    <strong>{{ kpi.homework_score|floatformat:1 }}%</strong>
  </div>
  <div class="component-bar">
    <div class="fill fill-homework" style="width:{{ kpi.homework_score }}%"></div>
  </div>
  <small class="ok-muted">Вес: 35%</small>
</div>

<div class="mb-2">
  <div class="d-flex justify-content-between mb-1">
    <span><i class="bi bi-star-fill text-success"></i> Оценки</span>
    <strong>{{ kpi.grade_score|floatformat:1 }}%</strong>
  </div>
  <div class="component-bar">
    <div class="fill fill-grade" style="width:{{ kpi.grade_score }}%"></div>
  </div>
  <small class="ok-muted">Вес: 25%</small>
</div>

<hr class="my-3">

<div>
  <div class="d-flex justify-content-between mb-1">
    <span class="fw-bold"><i class="bi bi-trophy-fill" style="color:var(--ok-accent)"></i> Итоговый KPI</span>
    <strong style="color:var(--ok-accent)">{{ kpi.total_kpi|floatformat:1 }}%</strong>
  </div>
  <div class="component-bar" style="height:16px">
    <div class="fill fill-total" style="width:{{ kpi.total_kpi }}%"></div>
  </div>
</div>
